<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cooklistry{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'recipes:category_list' %}">
                🍳 Cooklistry
            </a>

            <div class="navbar-nav">
                <a class="nav-link text-white"
                   href="{% url 'recipes:category_list' %}">
                    Categories
                </a>

                <a class="nav-link text-white"
                   href="{% url 'recipes:category_add' %}">
                    Add Category
                </a>
            </div>
        </div>
    </nav>
</header>

<main class="container py-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %}" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}
    {% endblock %}
</main>

<footer class="text-center text-muted py-4">
    <small>Cooklistry — Your personal recipe organizer</small>
</footer>

</body>
</html>
