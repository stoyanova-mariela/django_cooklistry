{% extends 'base.html' %}

{% block title %}Delete Category | Cooklistry{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-3 text-danger">Delete Category</h1>

                <p class="text-muted mb-3">
                    Are you sure you want to delete the category
                    <strong>"{{ object.name }}"</strong>?
                </p>

                <div class="alert alert-warning" role="alert">This action cannot be undone.</div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-danger">Yes, Delete Category</button>
                        <a href="{% url 'recipes:category_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
